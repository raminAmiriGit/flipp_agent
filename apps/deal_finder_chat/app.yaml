# Databricks App configuration for Flipp Deal-Finder
name: flipp-deal-finder-chat
description: Flipp Deal-Finder — chatbot for deals and coupons. Talks to the Multi-Agent Supervisor (MAS).
command:
  - streamlit
  - run
  - app.py
  # - --server.port=8501
  # - --server.address=0.0.0.0
env:
  - name: FLIPP_MAS_ENDPOINT_NAME
    value: ""
  - name: FLIPP_MAS_NAME
    value: "Flipp_Deal_Supervisor"
